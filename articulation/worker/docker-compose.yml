services:
  worker:
    build: .
    restart: "no"
    env_file:
      - .env
    volumes:
      - ${ARTICULATION_REPO_HOST:-${HOME}/src/ort}:/workspace/repo
      - ${ARTICULATION_STATE_HOST:-/opt/articulation/state}:/workspace/state
    working_dir: /app
    network_mode: host
    command: ["--job", "${WORKER_JOB:-ai-stack-research}"]
